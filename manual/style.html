<style>
:root { color-scheme:light; --paper:#fafaf8; --ink:#202523; --muted:#535d57; --line:#d4d9d4; --accent:#1d5a7a; --tip:#8a5a00; --screen:16rem; }
* { box-sizing:border-box; }
html { scroll-padding-top:1.5rem; }
body { margin:0; background:var(--paper); color:var(--ink); font:1.125rem/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
.layout { max-width:40rem; margin:0 auto; padding:clamp(2rem,8vw,5rem) 1.25rem 4rem; }
a { color:var(--accent); text-underline-offset:.2em; }
a:focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
p, ol, ul, dl, table { margin:0 0 1.25rem; }

header .kind { margin:0 0 .75rem; color:var(--muted); font-weight:600; }
h1 { font-size:clamp(2rem,6vw,2.75rem); line-height:1.12; letter-spacing:-.035em; font-weight:650; margin:0 0 1.5rem; }
header .about { color:var(--muted); }
.tour { display:flex; flex-wrap:wrap; gap:1.25rem 1.5rem; margin:2rem 0 0; padding:0; list-style:none; }
.tour a { display:block; color:var(--muted); font-size:.875rem; text-decoration:none; }
.tour a:hover { color:var(--accent); }
.tour img { display:block; width:8rem; height:8rem; margin-bottom:.4rem; }
img { image-rendering:pixelated; background:#000; border-radius:.25rem; }

nav { margin:2.5rem 0 0; padding:1.5rem 0; border-block:1px solid var(--line); font-size:1rem; }
nav h2 { margin:0 0 .75rem; font-size:.875rem; font-weight:600; color:var(--muted); }
nav ol { margin:0; padding:0; list-style:none; }
nav li { margin:0; padding:0; }
nav > ol > li { margin-bottom:.75rem; }
nav > ol > li:last-child { margin-bottom:0; }
nav a { display:block; padding:.15rem 0; color:var(--ink); font-weight:600; text-decoration:none; }
nav ol ol a { color:var(--muted); font-weight:400; }
nav ol ol ol { padding-left:1rem; }
nav a:hover { color:var(--accent); text-decoration:underline; }

main h2 { margin:4.5rem 0 1.25rem; padding-top:2rem; border-top:1px solid var(--line); font-size:1.875rem; line-height:1.2; letter-spacing:-.025em; font-weight:650; }
main > h2:first-child { margin-top:3rem; padding-top:0; border-top:0; }
h3 { margin:3rem 0 .9rem; font-size:1.375rem; line-height:1.3; letter-spacing:-.015em; font-weight:650; }
h4 { margin:2.25rem 0 .6rem; font-size:1.125rem; line-height:1.4; font-weight:650; }
h3 + h4 { margin-top:1.25rem; }
li { margin-bottom:.5rem; padding-left:.25rem; }
ol, ul { padding-left:1.4rem; }
li::marker { color:var(--muted); }
b { font-weight:650; }

/* A panel button or knob, and a line of text as the display shows it. */
kbd { font:inherit; font-size:.9em; font-weight:600; padding:.08em .4em .1em; background:#fff; border:1px solid #c3cac4; border-bottom-width:2px; border-radius:.3rem; white-space:nowrap; }
samp { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.88em; }

/* A screen beside the paragraphs that describe it. */
.screen { display:grid; grid-template-columns:minmax(0,1fr) var(--screen); gap:0 1.75rem; align-items:start; margin-bottom:1.25rem; }
.screen figure { grid-column:2; grid-row:1; margin:.3rem 0 0; }
.screen > div { grid-column:1; grid-row:1; }
.screen > div > :last-child { margin-bottom:0; }
.screen + .screen { margin-top:1.75rem; }
.screen img { display:block; width:var(--screen); height:var(--screen); }
figcaption { margin-top:.5rem; color:var(--muted); font-size:.875rem; }

/* Fields and features: a name and what it does. */
dl > div { display:grid; grid-template-columns:7rem minmax(0,1fr); gap:0 1.25rem; padding:.8rem 0; border-bottom:1px solid var(--line); }
dl > div:first-child { border-top:1px solid var(--line); }
dl.wide > div { grid-template-columns:11.5rem minmax(0,1fr); }
dt { font-weight:650; }
dd { margin:0; }
dd > :last-child { margin-bottom:0; }
dd ul { margin-top:.6rem; }

.note { margin:1.75rem 0; padding:.1rem 0 .1rem 1.1rem; border-left:3px solid var(--accent); }
.note b:first-child { display:block; margin-bottom:.15rem; color:var(--accent); font-size:.875rem; }
.note.tip { border-color:var(--tip); }
.note.tip b:first-child { color:var(--tip); }

table { width:100%; border-collapse:collapse; text-align:left; }
th, td { padding:.7rem 1.25rem .7rem 0; border-bottom:1px solid var(--line); vertical-align:top; }
tr:first-child > * { border-top:1px solid var(--line); }
th { width:11.5rem; font-weight:650; }
td { padding-right:0; }

footer { margin-top:4.5rem; padding-top:1.5rem; border-top:1px solid var(--line); color:var(--muted); font-size:.875rem; }
footer p { margin-bottom:.6rem; }
.address { overflow-wrap:anywhere; }

@media (max-width:36rem) {
  .screen { display:block; }
  .screen figure { margin:0 0 1.25rem; }
  .screen > div > :last-child { margin-bottom:1.25rem; }
  dl > div, dl.wide > div { display:block; }
  dt { margin-bottom:.2rem; }
  th { width:40%; }
}
@media (min-width:68rem) {
  .layout { display:grid; grid-template-columns:13rem minmax(0,40rem); grid-template-areas:"nav header" "nav main" "nav footer"; gap:0 4.5rem; justify-content:center; max-width:none; }
  header { grid-area:header; }
  main { grid-area:main; }
  main > h2:first-child { margin-top:3.5rem; padding-top:2rem; border-top:1px solid var(--line); }
  footer { grid-area:footer; }
  nav { grid-area:nav; position:sticky; top:1.5rem; align-self:start; max-height:calc(100vh - 1.5rem); overflow-y:auto; margin:0; padding:.35rem 0 2rem; border:0; font-size:.9375rem; }
}
@media print {
  html { font-size:9.4pt; }
  body { background:none; }
  .layout { display:block; max-width:none; padding:0; }
  nav, .tour { display:none; }
  main h2 { break-before:page; margin-top:0; border-top:0; padding-top:0; }
  main > h2:first-child { break-before:auto; margin-top:2rem; padding-top:0; border-top:0; }
  h3, h4 { break-after:avoid; }
  .screen figure, .note, dl > div, tr, li { break-inside:avoid; }
  a { color:inherit; text-decoration:none; }
  kbd { background:none; }
  @page { margin:18mm 20mm; }
}
</style>
